[package]
name = "ckc"
version = "0.1.0"
edition = "2021"
description = "ChronoKairo CLI (CKC) — Zero-Lib coding agent & context harness"

[[bin]]
name = "ckc"
path = "src/main.rs"

[features]
gpu = ["dep:ocl"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ocl = { version = "0.19", optional = true }

