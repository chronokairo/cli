[package]
name = "anamnesic-coder"
version = "0.1.0"
edition = "2021"
description = "Local coding agent — fusion of TinyCoder + llm-on-legacy-gpus"

[[bin]]
name = "chronokairo"
path = "src/main.rs"

[features]
gpu = ["dep:ocl"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
log = "0.4"
simple_logger = "5"
chrono = "0.4"
bytemuck = { version = "1", features = ["derive"] }
rand = "0.8"
regex = "1"
async-trait = "0.1"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
rpassword = "7"
rayon = "1"
    ocl = { version = "0.19", optional = true }
    pulldown-cmark = "0.12"
axum = { version = "0.8", features = ["ws"] }
portable-pty = "0.8"
futures-util = "0.3"
bytes = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
base64 = "0.22"
lsp-types = "0.97.0"
tower-lsp = "0.20.0"
parking_lot = "0.12"
lopdf = "0.34"

[dev-dependencies]
wiremock = "0.6"
